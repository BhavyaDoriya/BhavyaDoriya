<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: bold; font-size: 22px; fill: #fe428e; }
      .key { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: bold; font-size: 16px; fill: #f8d847; }
      .value { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 15px; fill: #a9fef7; }
      .bg { fill: #141321; stroke: #fe428e; stroke-width: 2; rx: 8; }
      .line { stroke: #fe428e; stroke-width: 1; opacity: 0.5; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="780" height="260" class="bg" />

  <!-- Title -->
  <text x="40" y="45" class="title">Player Stats</text>
  <line x1="40" y1="55" x2="760" y2="55" class="line" />

  <!-- Stats Grid -->
  <!-- Row 1 -->
  <text x="40" y="90" class="key">Class:</text>
  <text x="200" y="90" class="value">Full-Stack ML Engineer / Data Engineer</text>

  <!-- Row 2 -->
  <text x="40" y="130" class="key">Current Level:</text>
  <text x="200" y="130" class="value">Grinding XP in Data Engineering &amp; Machine Learning</text>

  <!-- Row 3 -->
  <text x="40" y="170" class="key">Main Loadout:</text>
  <text x="200" y="170" class="value">Python, Java, Express, React, FastAPI, Scikit-Learn, Polars, FLAML, Docker</text>

  <!-- Row 4 -->
  <text x="40" y="210" class="key">Side Quests:</text>
  <text x="200" y="210" class="value">Gaming, Binge watching sitcoms &amp; Yapping</text>

  <!-- Row 5 -->
  <text x="40" y="250" class="key">Passive Skill:</text>
  <text x="200" y="250" class="value">Writing heavy backend logic without breaking production</text>
</svg>
